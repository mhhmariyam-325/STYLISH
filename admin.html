
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f4f8;
            color: #222;
        }
        header {
            background: #17243b;
            color: white;
            padding: 20px;
        }
        main {
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #e5eaf2;
        }
        button {
            padding: 9px 14px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
<header>
    <h1>Sneakers Admin Dashboard</h1>
    <p>Manage products and inventory</p>

    <a href="index.html" style="
        display: inline-block;
        margin-top: 10px;
        padding: 10px 16px;
        background: white;
        color: #17243b;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
    "> Back to Home</a>
</header>


    <main>
        <section class="card">
            <h2>Total Products: <span id="count">Loading...</span></h2>
            <h3>Low Stock Products: <span id="lowStock">Loading...</span></h3>
        </section>

        <section class="card">
            <h2>Product Inventory</h2>
            
<h3>Add New Product</h3>

<form id="addProductForm">
    <input
        type="text"
        id="productName"
        placeholder="Product name"
        required
    >

    <input
        type="number"
        id="productPrice"
        placeholder="Price (LKR)"
        min="0.01"
        step="0.01"
        required
    >

    <input
        type="number"
        id="productStock"
        placeholder="Stock quantity"
        min="0"
        step="1"
        required
    >

    <input
        type="text"
        id="productImage"
        placeholder="Image path (e.g. images/pic1.webp)"
    >

    <button type="submit">Add Product</button>
</form>

            <p id="message">Loading products...</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price (LKR)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products"></tbody>
            </table>

            <br>
            <button onclick="loadProducts()">Refresh Products</button>
        </section>
    </main>

    <script>
        async function loadProducts() {
            const table = document.getElementById("products");
            const message = document.getElementById("message");

            table.innerHTML = "";
            message.textContent = "Loading products...";

            try {
const response = await fetch("http://localhost:3000/api/products");
                if (!response.ok) {
                    throw new Error("Could not load products");
                }

                const products = await response.json();

                document.getElementById("count").textContent =
                    products.length;

                document.getElementById("lowStock").textContent =
                    products.filter(p => Number(p.stock_qty) < 5).length;

                
products.forEach(p => {
    const row = document.createElement("tr");

    [p.id, p.name, Number(p.price).toFixed(2), p.stock_qty]
        .forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value ?? "";
            row.appendChild(cell);
        });

    const actions = document.createElement("td");

    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.onclick = () => editProduct(p);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.style.background = "#dc3545";
    deleteButton.style.marginLeft = "8px";
    deleteButton.onclick = () => deleteProduct(p.id);

    actions.appendChild(editButton);
    actions.appendChild(deleteButton);
    row.appendChild(actions);

    table.appendChild(row);
});


                message.textContent = products.length
                    ? "Products loaded successfully."
                    : "No products found.";

            } catch (error) {
                message.textContent =
                    "Could not load products. Check the server.";
                console.error(error);
            }
        }

        loadProducts();
        
document.getElementById("addProductForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const product = {
        name: document.getElementById("productName").value.trim(),
        price: Number(document.getElementById("productPrice").value),
        stock_qty: Number(document.getElementById("productStock").value),
        image: document.getElementById("productImage").value.trim()
    };

    try {
        const response = await fetch("http://localhost:3000/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(product)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Could not add product.");
            return;
        }

        alert("Product added successfully!");
        document.getElementById("addProductForm").reset();
        loadProducts();

    } catch (error) {
        console.error("Error adding product:", error);
        alert("Could not connect to the server.");
    }
});

async function editProduct(product) {
    const name = prompt("Enter product name:", product.name);
    if (name === null) return;

    const priceText = prompt("Enter product price:", product.price);
    if (priceText === null) return;

    const stockText = prompt("Enter stock quantity:", product.stock_qty);
    if (stockText === null) return;

    const image = prompt("Enter image path:", product.image || "");
    if (image === null) return;

    const price = Number(priceText);
    const stock_qty = Number(stockText);

    if (
        !name.trim() ||
        priceText.trim() === "" ||
        !Number.isFinite(price) ||
        price <= 0 ||
        stockText.trim() === "" ||
        !Number.isInteger(stock_qty) ||
        stock_qty < 0
    ) {
        alert("Please enter a valid name, price, and stock quantity.");
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:3000/api/products/${product.id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name.trim(),
                    price,
                    stock_qty,
                    image: image.trim()
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Could not update product.");
            return;
        }

        alert("Product updated successfully!");
        loadProducts();
    } catch (error) {
        console.error(error);
        alert("Could not connect to the server.");
    }
}

async function deleteProduct(productId) {
    const confirmed = confirm(
        "Are you sure you want to delete this product?"
    );

    if (!confirmed) return;

    try {
        const response = await fetch(
            `http://localhost:3000/api/products/${productId}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Could not delete product.");
            return;
        }

        alert("Product deleted successfully!");
        loadProducts();

    } catch (error) {
        console.error(error);
        alert("Could not connect to the server.");
    }
}

    </script>
</body>
</html>
