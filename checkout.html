<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - STYLISH</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .checkout-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .checkout-content {
            display: flex;
            gap: 40px;
        }

        .customer-details,
        .order-summary {
            flex: 1;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .order-summary {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
        }

        #cartItems {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        #payNow {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #payNow:hover {
            background: #333;
        }

        .logout {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .checkout-content {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="checkout-container">

    <h1>Checkout</h1>

    <div class="checkout-content">

        <!-- CUSTOMER DETAILS -->
        <div class="customer-details">

            <h2>Customer Details</h2>

            <form id="checkoutForm">

                <label for="firstName">First Name</label>
                <input
                    type="text"
                    id="firstName"
                    required
                >

                <label for="lastName">Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="phone">Phone</label>
                <input
                    type="tel"
                    id="phone"
                    required
                >

                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    required
                >

                <label for="city">City</label>
                <input
                    type="text"
                    id="city"
                    required
                >

                <button type="submit" id="payNow">
                    Pay Now
                </button>

            </form>

            <button class="logout" onclick="logoutUser()">
                Logout
            </button>

        </div>


        <!-- ORDER SUMMARY -->
        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="cartItems">
                Loading cart...
            </div>

            <div class="total">
                Total:
                LKR <span id="cartTotal">0.00</span>
            </div>

        </div>

    </div>

</div>


<script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function displayCart() {

        const cartItems = document.getElementById("cartItems");
        const cartTotal = document.getElementById("cartTotal");

        if (cart.length === 0) {

            cartItems.innerHTML = "<p>Your cart is empty.</p>";
            cartTotal.textContent = "0.00";

            return;
        }

        let total = 0;

        cartItems.innerHTML = "";

        cart.forEach((item) => {

            const quantity = Number(item.quantity) || 1;
            const price = Number(item.price) || 0;

            const itemTotal = price * quantity;

            total += itemTotal;

            const div = document.createElement("div");

            div.className = "cart-item";

            div.innerHTML = `
                <span>
                    ${item.name} x ${quantity}
                </span>

                <span>
                    LKR ${itemTotal.toFixed(2)}
                </span>
            `;

            cartItems.appendChild(div);

        });

        cartTotal.textContent = total.toFixed(2);
    }


    document
        .getElementById("checkoutForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            const firstName =
                document.getElementById("firstName").value;

            const lastName =
                document.getElementById("lastName").value;

            const email =
                document.getElementById("email").value;

            const phone =
                document.getElementById("phone").value;

            const address =
                document.getElementById("address").value;

            const city =
                document.getElementById("city").value;

            const amount =
                document.getElementById("cartTotal").textContent;

            console.log("Customer:", {
                firstName,
                lastName,
                email,
                phone,
                address,
                city
            });

            console.log("Amount:", amount);

            const orderId = "ORDER_" + Date.now();
const response = await fetch("http://localhost:3000/payhere", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        order_id: orderId,
        amount: amount,
        currency: "LKR"
    })
});

const paymentData = await response.json();

console.log("PayHere data:", paymentData);


// Create a form for PayHere
const payHereForm = document.createElement("form");

payHereForm.method = "POST";

payHereForm.action =
    "https://sandbox.payhere.lk/pay/checkout";


// Add PayHere field
function addField(name, value) {

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = name;
    input.value = value;

    payHereForm.appendChild(input);
}


// Merchant details
addField(
    "merchant_id",
    paymentData.merchant_id
);


// Order details
addField(
    "order_id",
    paymentData.order_id
);

addField(
    "items",
    "STYLISH Sneakers"
);

addField(
    "amount",
    paymentData.amount
);

addField(
    "currency",
    paymentData.currency
);


// Customer details
addField(
    "first_name",
    firstName
);

addField(
    "last_name",
    lastName
);

addField(
    "email",
    email
);

addField(
    "phone",
    phone
);

addField(
    "address",
    address
);

addField(
    "city",
    city
);

addField(
    "country",
    "Sri Lanka"
);


// Return and cancel URLs
addField(
    "return_url",
    window.location.origin + "/payment-success.html"
);

addField(
    "cancel_url",
    window.location.origin + "/checkout.html"
);
addField(
    "notify_url",
    window.location.origin + "/api/payhere-notify"
);

// Security hash
addField(
    "hash",
    paymentData.hash
);


// Add form to page
document.body.appendChild(payHereForm);


// Submit to PayHere Sandbox
payHereForm.submit();

        });


    async function logoutUser() {

        const response = await fetch("/api/logout", {
            method: "POST"
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "index.html";
        }
    }


    displayCart();

</script>

</body>
</html>
